<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <title>Autók kezelése</title>

    <style>
      body {
        background: #eef1f5;
        font-family: Arial;
        padding: 20px;
      }

      .container {
        max-width: 1000px;
        margin: auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      button {
        padding: 6px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .add-btn {
        background: #007bff;
        color: white;
        margin-bottom: 20px;
      }

      .view-btn {
        background: #28a745;
        color: white;
      }

      .car-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
      }

      .car-card {
        background: white;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .car-card h3 {
        margin: 0 0 10px 0;
        color: #007bff;
      }

      .car-card p {
        margin: 0 0 10px 0;
      }

      .edit-btn {
        background: #ffc107;
      }

      .delete-btn {
        background: #dc3545;
        color: white;
      }

      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
      }

      .modal-box {
        background: white;
        padding: 20px;
        width: 300px;
        border-radius: 8px;
      }

      .modal-box input {
        width: 100%;
        margin-bottom: 10px;
        padding: 6px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Autók</h1>
      <button class="add-btn" onclick="openAdd()">Új autó</button>
      <div id="car-list" class="car-list"></div>
    </div>

    <div id="modal" class="modal"></div>

    <script>
      var url = "https://surveys-5jvt.onrender.com/api/cars/";
      var fields = ["model", "brand", "year"];

      function showError(text) {
        alert(text);
      }

      function loadCars() {
        fetch(url, { method: "GET" })
          .then(function (response) {
            if (!response.ok) throw new Error();
            return response.json();
          })
          .then(function (data) {
            var list = document.getElementById("car-list");
            list.innerHTML = "";

            data.forEach(function (car) {
              var card = document.createElement("div");
              card.className = "car-card";

              var title = document.createElement("h3");
              title.innerText = car.model;

              var idText = document.createElement("p");
              idText.innerText = "ID: " + car.id;

              var view = document.createElement("button");
              view.className = "view-btn";
              view.innerText = "Részletek";
              view.onclick = function () {
                viewCar(car.id);
              };

              card.appendChild(title);
              card.appendChild(idText);
              card.appendChild(view);

              if (car.id > 4) {
                var edit = document.createElement("button");
                edit.className = "edit-btn";
                edit.innerText = "Szerkeszt";
                edit.onclick = function () {
                  openEdit(car);
                };

                var del = document.createElement("button");
                del.className = "delete-btn";
                del.innerText = "Törlés";
                del.onclick = function () {
                  deleteCar(car.id);
                };

                card.appendChild(edit);
                card.appendChild(del);
              }

              list.appendChild(card);
            });
          })
          .catch(function () {
            showError("Nem sikerült betölteni az autókat");
          });
      }

      function viewCar(id) {
        fetch(url + id + "/", { method: "GET" })
          .then(function (response) {
            if (!response.ok) throw new Error();
            return response.json();
          })
          .then(function (car) {
            var modal = document.getElementById("modal");
            modal.innerHTML = "";
            modal.style.display = "flex";

            var box = document.createElement("div");
            box.className = "modal-box";

            for (var key in car) {
              var p = document.createElement("p");
              p.innerText = key + ": " + car[key];
              box.appendChild(p);
            }

            var close = document.createElement("button");
            close.innerText = "Bezár";
            close.onclick = closeModal;

            box.appendChild(close);
            modal.appendChild(box);
          })
          .catch(function () {
            showError("Nem sikerült betölteni a részleteket");
          });
      }

      function openAdd() {
        openForm(null);
      }

      function openEdit(car) {
        openForm(car);
      }

      function openForm(car) {
        var modal = document.getElementById("modal");
        modal.innerHTML = "";
        modal.style.display = "flex";

        var box = document.createElement("div");
        box.className = "modal-box";

        var title = document.createElement("h3");
        title.innerText = car ? "Szerkesztés" : "Új autó";
        box.appendChild(title);

        var inputs = {};

        fields.forEach(function (f) {
          var input = document.createElement("input");
          input.placeholder = f;
          if (car) {
            input.value = car[f] || "";
          }
          inputs[f] = input;
          box.appendChild(input);
        });

        var save = document.createElement("button");
        save.innerText = "Mentés";
        save.onclick = function () {
          var data = {};
          fields.forEach(function (f) {
            data[f] = inputs[f].value;
          });

          if (car) {
            data.id = car.id;
            updateCar(data);
          } else {
            addCar(data);
          }
        };

        var cancel = document.createElement("button");
        cancel.innerText = "Mégse";
        cancel.onclick = closeModal;

        box.appendChild(save);
        box.appendChild(cancel);
        modal.appendChild(box);
      }

      function addCar(data) {
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        })
          .then(function (response) {
            if (!response.ok) throw new Error();
            return response.json();
          })
          .then(function (car) {
            closeModal();
            loadCars();
            viewCar(car.id);
          })
          .catch(function () {
            showError("Nem sikerült az autót hozzáadni");
          });
      }

      function updateCar(data) {
        fetch(url + data.id + "/", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        })
          .then(function (response) {
            if (!response.ok) throw new Error();
            return response.json();
          })
          .then(function () {
            closeModal();
            loadCars();
            viewCar(data.id);
          })
          .catch(function () {
            showError("Nem sikerült a módosítás");
          });
      }

      function deleteCar(id) {
        if (!confirm("Biztos törlöd?")) return;

        fetch(url + id + "/", { method: "DELETE" })
          .then(function (response) {
            if (!response.ok) throw new Error();
            loadCars();
          })
          .catch(function () {
            showError("Nem sikerült törölni az autót");
          });
      }

      function closeModal() {
        var modal = document.getElementById("modal");
        modal.style.display = "none";
        modal.innerHTML = "";
      }

      loadCars();
    </script>
  </body>
</html>
